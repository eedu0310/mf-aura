# Nginx na frente do AURA, com HTTPS.
#
# O HTTPS não é enfeite: sem ele o navegador bloqueia a geolocalização das
# visitas, o microfone do relato por voz e a instalação do app no celular.
#
#   sudo cp deploy/nginx-aura.conf /etc/nginx/sites-available/aura
#   sudo ln -s /etc/nginx/sites-available/aura /etc/nginx/sites-enabled/aura
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d crm.seudominio.com.br
#
# O certbot reescreve este arquivo sozinho com o certificado.

server {
    listen 80;
    server_name crm.seudominio.com.br;

    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # O nginx é a borda: o IP do cliente é o $remote_addr e ponto. Com
        # $proxy_add_x_forwarded_for o nginx ACRESCENTAVA o IP real ao
        # X-Forwarded-For que o próprio visitante mandou, e o app lê o primeiro
        # da lista — um robô trocava de "IP" a cada envio e furava o limite de
        # envios por IP do formulário e do chat do site.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # A supervisão da AURA e a geração de relatórios demoram.
        proxy_read_timeout 300s;
    }
}
